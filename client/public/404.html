<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // SPA redirect for GitHub Pages
      // Redirects all paths back to index.html with the path preserved
      var repo = '/phatpham';
      var fullPath = window.location.pathname;
      var path = fullPath.startsWith(repo) ? fullPath.slice(repo.length) : fullPath;
      sessionStorage.setItem('spa-redirect', path + window.location.search + window.location.hash);
      window.location.replace(repo + '/');
    </script>
  </head>
  <body></body>
</html>
